name: Atualizar Lista IPTV Unificada

on:
  schedule:
    # Executa automaticamente a cada 12 horas (às 00:00 e 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-playlist-update"
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar atualização e limpeza da lista M3U
        run: python update_playlist.py

      - name: Commit e Push automático dos arquivos gerados (docs/)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lista_unificada.m3u docs/index.html
          if git diff --staged --quiet; then
            echo "Nenhuma alteração na lista."
          else
            git commit -m "chore: atualiza lista IPTV unificada automaticamente [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar pasta docs/ para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
